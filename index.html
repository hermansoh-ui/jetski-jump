<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a1f3d">
<title>Jet Ski Jump</title>
<style>
  :root { --bg: #2a1f3d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #2a1f3d; } }
  :root[data-theme="dark"] { --bg: #2a1f3d; }
  html { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body { display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #prof { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(42,31,61,0.6); touch-action: auto; }
  #prof[hidden] { display: none; }
  #prof form { width: min(300px, calc(100vw - 32px)); box-sizing: border-box; padding: 18px; background: #fff1dc; border: 4px solid #2a1f3d; box-shadow: 4px 6px 0 rgba(42,31,61,0.35);
    font: bold 14px/1.4 ui-monospace, Menlo, monospace; color: #2a1f3d; text-transform: uppercase; display: flex; flex-direction: column; gap: 10px; }
  #prof h2 { margin: 0; font-size: 16px; color: #e8365f; }
  #prof p { margin: 0; font-size: 11px; color: #8a6f8f; text-transform: none; font-weight: normal; }
  #prof input { font: inherit; font-size: 16px; padding: 8px; border: 3px solid #2a1f3d; background: #fff; color: #2a1f3d; -webkit-user-select: text; user-select: text; }
  #prof .row { display: flex; gap: 8px; }
  #prof button { flex: 1; font: inherit; padding: 9px 6px; border: 3px solid #2a1f3d; background: #e8365f; color: #fff; cursor: pointer; }
  #prof button.alt { background: #fff; color: #2a1f3d; }
  #pmsg { min-height: 1.4em; font-size: 12px; color: #e8365f; }
</style>
</head>
<body>
<div id="safe" style="position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)"></div>
<canvas id="c" aria-label="Jet Ski Jump game. Tap or press space to jump, hold for a bigger jump."></canvas>
<div id="prof" hidden><form id="pform" autocomplete="off">
  <h2>Save across devices</h2>
  <p>Pick a name and a 4-digit PIN. Enter the same two on any phone or laptop to keep your shells and outfits.</p>
  <input id="pname" maxlength="24" placeholder="Name" aria-label="Name" autocapitalize="characters" spellcheck="false">
  <input id="ppin" maxlength="4" placeholder="4-digit PIN" aria-label="4-digit PIN" inputmode="numeric" pattern="[0-9]*" type="password">
  <div id="pmsg" role="status"></div>
  <div class="row"><button type="button" class="alt" id="pcancel">Cancel</button><button type="submit" id="pgo">Save</button></div>
  <button type="button" class="alt" id="pout" hidden>Sign out of this device</button>
</form></div>

// <core> — pure game rules shared with src/fairness-v7.test.js (no DOM in here)
const VH = 480;
const HORIZON = 236;          // sky / sea boundary
const LANE = 372;             // waterline the jet ski rides on
const PX = 22;                // player frame left edge
const FW = 72, FH = 80, HULL_B = 76;
const JUMP_V = 500, GRAV = 1250;
const HOLD_G = 0.3, HOLD_START = 0.08, HOLD_END = 0.34;   // holding the button lowers gravity while rising
const AIR = 2 * JUMP_V / GRAV, AIR_HOLD = 1.1;
const PX_PER_M = 12;
const STEP = 1 / 120;
const BIRD_DX = 20;           // gulls fly toward her a little faster than the water scrolls
const PLAYER_HB = [{ x: 14, y: 58, w: 38, h: 16 }, { x: 16, y: 14, w: 28, h: 42 }];
const NEAR_HB = [{ x: 4, y: 58, w: 48, h: 16 }, PLAYER_HB[1]];   // near-miss only: hull box stretched back over the drawn tail
const ROCKS = [
  { img: 'rock0', w: 43, h: 26, hb: { x: 7, y: 3, w: 27, h: 21 } },
  { img: 'rock1', w: 44, h: 33, hb: { x: 7, y: 3, w: 30, h: 28 } },
  { img: 'rock2', w: 43, h: 46, hb: { x: 8, y: 3, w: 26, h: 40 } },
];
const GULL = { fw: 43, fh: 40, hb: { x: 6, y: 14, w: 32, h: 20 } };
const GULL_Y = LANE - 106;    // hitbox bottom sits just above the rider's head
const POST_W = 14;   // channel markers, by hitbox top above the water: low (a tap clears it), mid (short hold), tall (full hold)
const POSTS = [76, 96, 114].map(t => ({ h: t + 13, hb: { x: 3, y: 8, w: 8, h: t + 5 } }));

function speedAt(tt) { return Math.min(400, 160 + 190 * (1 - Math.exp(-tt / 70)) + 0.9 * tt); }

function makeObstacle(spec, x) {
  if (spec.type === 'rock') { const R = ROCKS[spec.k]; return { type: 'rock', k: R.img, x, y: LANE + 5 - R.h, w: R.w, h: R.h, hb: R.hb }; }
  if (spec.type === 'post') { const Q = POSTS[spec.k]; return { type: 'post', k: spec.k, x, y: LANE + 5 - Q.h, w: POST_W, h: Q.h, hb: Q.hb }; }

// Alternates calm stretches (single obstacles, roomy gaps) with build-ups (combos, tighter gaps).
// Unlock points, stretch lengths, pattern choice and every gap are randomised per run.
function newDirector() {
  dir = { unlock: {}, seen: {}, last: '', phase: 'calm', left: 3 + Math.floor(Math.random() * 3) };
  for (const k in PATTERNS) { const [a, b] = PATTERNS[k].unlock; dir.unlock[k] = a + Math.random() * (b - a); }
}

  else { dir.phase = 'calm'; dir.left = 1 + Math.floor(Math.random() * 3); }
}

  const birdOk = avail.includes('bird') && dir.last !== 'bird';
  if (dir.phase === 'calm') return birdOk && Math.random() < Math.min(0.4, 0.18 + m / 2500) ? 'bird' : 'rock';
  const fresh = avail.filter(k => !dir.seen[k] && k !== 'rock' && k !== 'bird');

  const pool = avail.filter(k => k === 'rock' || k !== dir.last);
