// <core> — pure game rules shared with src/fairness-v5.test.js (no DOM in here)
const VH = 480;
const HORIZON = 236;          // sky / sea boundary
const LANE = 372;             // waterline the jet ski rides on
const PX = 22;                // player frame left edge
const FW = 72, FH = 80, HULL_B = 76;
const JUMP_V = 500, GRAV = 1250;
const HOLD_G = 0.3, HOLD_START = 0.08, HOLD_END = 0.34;   // holding the button lowers gravity while rising
const AIR = 2 * JUMP_V / GRAV, AIR_HOLD = 1.1;
const PX_PER_M = 12;
const STEP = 1 / 120;
const BIRD_DX = 20;           // gulls fly toward her a little faster than the water scrolls
const PLAYER_HB = [{ x: 14, y: 58, w: 38, h: 16 }, { x: 16, y: 14, w: 28, h: 42 }];
const NEAR_HB = [{ x: 4, y: 58, w: 48, h: 16 }, PLAYER_HB[1]];   // near-miss only: hull box stretched back over the drawn tail
const ROCKS = [
  { img: 'rock0', w: 43, h: 26, hb: { x: 7, y: 3, w: 27, h: 21 } },
  { img: 'rock1', w: 44, h: 33, hb: { x: 7, y: 3, w: 30, h: 28 } },
  { img: 'rock2', w: 43, h: 46, hb: { x: 8, y: 3, w: 26, h: 40 } },
];
const GULL = { fw: 43, fh: 40, hb: { x: 6, y: 14, w: 32, h: 20 } };
const GULL_Y = LANE - 106;    // hitbox bottom sits just above the rider's head
const POST = { w: 14, h: 126, hb: { x: 3, y: 8, w: 8, h: 118 } };   // channel marker: needs a held jump

function speedAt(tt) { return Math.min(400, 160 + 190 * (1 - Math.exp(-tt / 70)) + 0.9 * tt); }

function makeObstacle(spec, x) {
  if (spec.type === 'rock') { const R = ROCKS[spec.k]; return { type: 'rock', k: R.img, x, y: LANE + 5 - R.h, w: R.w, h: R.h, hb: R.hb }; }
  if (spec.type === 'post') return { type: 'post', x, y: LANE + 5 - POST.h, w: POST.w, h: POST.h, hb: POST.hb };
  return { type: 'bird', x, y: GULL_Y, w: GULL.fw, h: GULL.fh, hb: GULL.hb, ph: 0 };
}
function obsBox(o, bob) { return { x: o.x + o.hb.x, y: o.y + (o.type === 'bird' ? bob : 0) + o.hb.y, w: o.hb.w, h: o.hb.h }; }
function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function boxGap(a, b) {   // pixels between two boxes (0 when touching / overlapping on both axes)
  const dx = Math.max(0, b.x - (a.x + a.w), a.x - (b.x + b.w));
  const dy = Math.max(0, b.y - (a.y + a.h), a.y - (b.y + b.h));
  return Math.max(dx, dy);
}
function playerBoxes(top) { return PLAYER_HB.map(b => ({ x: PX + b.x, y: top + b.y, w: b.w, h: b.h })); }
function obsSpeed(o, s) { return o.type === 'bird' ? s + BIRD_DX : s; }

// jump physics for one fixed step. p = { lift, vy, airborne, holding, holdT }
function stepJump(p, dt) {
  if (!p.airborne) return false;
  p.holdT += dt;
  const g = (p.holding && p.vy > 0 && p.holdT >= HOLD_START && p.holdT < HOLD_END) ? GRAV * HOLD_G : GRAV;
  p.vy -= g * dt;
  p.lift += p.vy * dt;
  if (p.lift <= 0) { p.lift = 0; p.vy = 0; p.airborne = false; return true; }   // landed
  return false;
}

// ---------- patterns ----------
// Each pattern returns obstacle specs with dx = offset from the spawn point, plus its length in px.
// s = speed, u = 0..1 tightness (0 = generous first encounter), r = random() source.
// Gaps are in seconds of travel so they scale with speed; every range is checked by the fairness test.
function lerp(a, b, u) { return a + (b - a) * u; }
const PATTERNS = {
  rock: {
    unlock: [0, 0], weight: 3,
    make(s, u, r, m) {
      const q = r();
      const k = m < 150 ? (q < 0.75 ? 0 : 1) : m < 350 ? (q < 0.5 ? 0 : 1) : (q < 0.35 ? 0 : q < 0.7 ? 1 : 2);
      return { obs: [{ type: 'rock', k, dx: 0 }], len: ROCKS[k].w };
    },
  },
  bird: {
    unlock: [100, 160], weight: 1.4,
    make() { return { obs: [{ type: 'bird', dx: 0 }], len: GULL.fw + 30 }; },
  },
  double: {   // two rocks: hop-hop when spread out, one held leap when bunched
    unlock: [200, 400], weight: 1.6,
    make(s, u, r) {
      const k1 = r() < 0.5 ? 0 : 1, k2 = r() < 0.6 ? 0 : 1;
      const leap = r() < 0.45;
      const gap = leap ? s * lerp(0.06, 0.2, r()) : s * (lerp(0.5, 0.38, u) + r() * 0.06);
      const x2 = ROCKS[k1].w + gap;
      return { obs: [{ type: 'rock', k: k1, dx: 0 }, { type: 'rock', k: k2, dx: x2 }], len: x2 + ROCKS[k2].w, hold: leap };
    },
  },
  post: {     // channel marker taller than a tap can clear
    unlock: [450, 650], weight: 1.1,
    make() { return { obs: [{ type: 'post', dx: 0 }], len: POST.w, hold: true }; },
  },
  thread: {   // rock, then a gull right behind it: tap (not hold) so you're down before it arrives
    unlock: [600, 800], weight: 1.3,
    make(s, u, r) {
      const k = r() < 0.6 ? 0 : 1;
      const gap = s * (lerp(0.55, 0.42, u) + r() * 0.06);
      return { obs: [{ type: 'rock', k, dx: 0 }, { type: 'bird', dx: ROCKS[k].w + gap }], len: ROCKS[k].w + gap + GULL.fw + 30 };
    },
  },
  birdrock: { // gull first, rock right after: wait, then jump late
    unlock: [700, 950], weight: 1.0,
    make(s, u, r) {
      const k = r() < 0.6 ? 0 : 1;
      const gap = s * (lerp(0.32, 0.2, u) + r() * 0.05);
      return { obs: [{ type: 'bird', dx: 0 }, { type: 'rock', k, dx: GULL.fw + gap }], len: GULL.fw + gap + ROCKS[k].w };
    },
  },
  triple: {   // three rocks in a row: keep the rhythm
    unlock: [900, 1200], weight: 0.9,
    make(s, u, r) {
      const obs = []; let x = 0;

  popups.push({ text: word, age: 0, life: 0.9, x: PX + 48, y: top - 16, size: 2, col: streak >= 3 ? RAINBOW : ['#ffffff', '#fff6b8', '#ffd35c'] });
  popups.push({ text: '+' + pts, age: 0, life: 0.9, x: PX + 48, y: top - 1, size: 1, col: '#ffffff' });
  sparkle(o.x + o.w / 2, o.type === 'bird' ? o.y + 30 : o.y + 4, 14, streak >= 3 ? RAINBOW : ['#fff6b8', '#ffffff', '#ffd35c']);
  sfx.close();
  if (streak === 3) { popups.push({ text: 'STREAK X3', age: 0, life: 1.3, y: 176, size: 2, col: RAINBOW }); sfx.streak(3); }
  if (streak === 5) { popups.push({ text: 'STREAK X5', age: 0, life: 1.3, y: 176, size: 2, col: RAINBOW }); sfx.streak(5); leap(false); dolphinT = 2.6; }
  if (streak === 8) { popups.push({ text: 'ON FIRE!', age: 0, life: 1.6, y: 172, size: 3, col: ['#fff6b8', '#ffd35c', '#ff9f3a', '#e8365f'] }); sfx.streak(8); leap(true); dolphinT = 2.6; }
}
function leap(pair) {
  const add = (dx, delay) => dolphins.push({ x: PX + 70 + dx + Math.random() * 40, base: HORIZON + 34, h: 22 + Math.random() * 8, dur: 0.95, age: -delay, splashed: false });
  add(0, 0);
  if (pair) add(22, 0.18);
}

function update(dt) {
  animT += dt;
  btnT = Math.max(0, btnT - dt);
  flash = Math.max(0, flash - dt);
  shake = Math.max(0, shake - dt);

  if (state === 'title') {
    speed = 90;
  } else if (state === 'play') {
    t += dt;
    speed = speedAt(t);
    dist += speed * dt;
    score = meters() + bonus;
    nextGap -= speed * dt;
    if (nextGap <= 0) spawn();
  } else {
    deadT += dt;
    speed *= Math.exp(-2.5 * dt);
  }
  scroll += speed * dt;

  for (const o of obstacles) o.x -= obsSpeed(o, speed) * dt;
  obstacles = obstacles.filter(o => o.x + o.w > -10);

  // player physics
  if (P.airborne) {
    jumpBuffer = Math.max(0, jumpBuffer - dt);
    if (stepJump(P, dt) && state !== 'dead') {
      landT = 0.22; sfx.land();
      burst(PX + 34, LANE + 1, 12, 0, 90, ['#ffffff', '#c9f3f0', '#9fe3dc'], 120);
      if (jumpBuffer > 0 && !birdNear()) { jumpBuffer = 0; jump(); }
      jumpBuffer = 0;
    }
  } else if (state === 'dead' && P.lift > 0) {
    P.lift = Math.max(0, P.lift - 200 * dt);
  }
  landT = Math.max(0, landT - dt);

  // wake spray (rainbow during a streak)
  if (!P.airborne && state !== 'dead') {
    wakeT -= dt;
    while (wakeT <= 0) {
      wakeT += state === 'play' ? 0.025 : 0.05;
      const c = streak >= 3 && state === 'play' ? RAINBOW[Math.floor(Math.random() * RAINBOW.length)] : Math.random() < 0.5 ? '#ffffff' : '#c9f3f0';
      particles.push({ x: PX + 6 + Math.random() * 4, y: LANE + 1, vx: -speed * 0.35 - Math.random() * 40, vy: -20 - Math.random() * 70,
        life: 0.3 + Math.random() * 0.25, age: 0, c, s: Math.random() < 0.25 ? 2 : 1 });
    }
  }
  for (const p of particles) {
    p.age += dt;
    if (p.kind === 'spark') { p.vx *= Math.exp(-3 * dt); p.vy *= Math.exp(-3 * dt); }
    else if (p.kind === 'heart') { p.vx = Math.sin(p.age * 3 + p.ph) * 14; }
    else p.vy += 420 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  particles = particles.filter(p => p.age < p.life && p.y < LANE + 12);
  for (const p of popups) p.age += dt;
  popups = popups.filter(p => p.age < p.life);

  // dolphins
  if (state === 'play' && streak >= 5) { dolphinT -= dt; if (dolphinT <= 0) { leap(streak >= 8); dolphinT = 2.2 + Math.random(); } }
  for (const d of dolphins) {
    const was = d.age; d.age += dt;
    if (was < 0 && d.age >= 0) { sfx.splash(); burst(d.x, d.base, 10, 20, 50, ['#ffffff', '#c9f3f0'], 110); }
    if (!d.splashed && d.age >= d.dur) { d.splashed = true; burst(d.x + 34, d.base, 12, -20, 50, ['#ffffff', '#c9f3f0'], 120); }
  }
  dolphins = dolphins.filter(d => d.age < d.dur + 0.1);

  if (state === 'play') {
    const pb = playerBoxes(playerTop());
    const nb = NEAR_HB.map(b => ({ x: PX + b.x, y: playerTop() + b.y, w: b.w, h: b.h }));
    for (const o of obstacles) {
      const ob = obsBox(o, o.type === 'bird' ? birdBob(o) : 0);
      for (const b of pb) if (hit(b, ob)) { die(); return; }
      if (ob.x < PX + 120) for (const b of nb) o.minGap = Math.min(o.minGap, boxGap(b, ob));
      // score only once the gap can no longer shrink (close calls on the descent behind a rock count too)
      if (!o.done && ob.x + ob.w < PX + NEAR_HB[0].x - CLOSE_PX[o.type]) { o.done = true; scorePass(o); }
    }
    // milestones / best / a message from Herman
    if (score >= nextMilestone) {
      if (nextMilestone !== 1000) { popups.push({ text: nextMilestone + 'M!', age: 0, life: 1.1, y: 92, col: ['#fff6b8', '#ffd35c', '#ff9f3a'] }); sfx.milestone(); }
      nextMilestone += 100;
    }
    if (!poopyShown && score >= 1000) {
      poopyShown = true;
      popups.push({ text: 'WELL DONE,', age: 0, life: 3, y: 96, size: 2, col: '#ffffff', heart: false });
      popups.push({ text: 'POOPY!', age: 0, life: 3, y: 114, size: 3, col: ['#ffe0f0', '#ff7aa8', '#e8365f'], heart: true });
      hearts(VW / 2, 150, 18, 80);
      sfx.love();
    }
    if (!bestAnnounced && startBest > 0 && score > startBest) {
      bestAnnounced = true;
      popups.push({ text: 'NEW BEST!', age: 0, life: 1.6, y: 150, col: ['#ffe0f0', '#ff7aa8', '#e8365f'] });
      sfx.best();
      burst(VW / 2, 156, 24, 0, 120, ['#ffd35c', '#ffffff', '#ff7aa8'], 160);
    }
  }
}
function birdNear() { const air = active.has(lastPressId) ? AIR_HOLD : AIR; return obstacles.some(o => o.type === 'bird' && o.x > PX - o.w && o.x < PX + FW + (speed + BIRD_DX) * air); }
function birdBob(o) { return Math.round(Math.sin(animT * 4 + o.ph) * 2); }

// ---------- drawing ----------
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disc(cx, cy, r, c) {
  ctx.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.8)); ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1); }
}
function mod(a, n) { return ((a % n) + n) % n; }

function drawSky() {
  const e = bandEdges(0, HORIZON, SKY.length, 0.8);
  for (let i = 0; i < SKY.length; i++) rect(0, e[i], VW, e[i + 1] - e[i], SKY[i]);
  ctx.drawImage(img.sun, VW - 62, HORIZON - 92);
  for (const c of clouds) {
    const im = img[c.k], span = VW + im.width + 40;
    const x = mod(c.x - scroll * c.f, span) - im.width - 20;
    ctx.drawImage(im, Math.round(x), c.y);
  }
  const isl = img.island, span = isl.width + 170;
  for (let x = mod(40 - scroll * 0.02, span) - span; x < VW; x += span) ctx.drawImage(isl, Math.round(x), HORIZON - isl.height + 3);
}
function drawSea() {
  for (const b of seaBands) {
    rect(0, b.y0, VW, b.y1 - b.y0, b.col);
    if (!b.crests.length) continue;
    ctx.fillStyle = b.crestCol;
    const off = scroll * b.f;
    for (const c of b.crests) {
      for (let x = mod(c.x - off, b.P) - b.P; x < VW; x += b.P) ctx.fillRect(Math.round(x), c.y, c.len, 1);
    }
  }
  rect(0, HORIZON, VW, 1, '#e9fcf9');
  // waterline foam behind the player
  ctx.fillStyle = '#d9f7f2';
  for (let x = mod(-scroll, 24) - 24; x < VW; x += 24) { ctx.fillRect(Math.round(x), LANE - 1, 14, 1); ctx.fillRect(Math.round(x) + 4, LANE, 18, 1); }
}
function drawDolphins() {
  for (const d of dolphins) {
    if (d.age < 0) continue;
    const k = Math.min(1, d.age / d.dur);
    const x = d.x + k * 40, y = d.base - Math.sin(Math.PI * k) * d.h;
    const ang = Math.atan2(-Math.PI * d.h * Math.cos(Math.PI * k), 40) * 0.8;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, VW, d.base); ctx.clip();
    ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(ang);
    ctx.drawImage(DOLPHIN, -16, -7);
    ctx.restore();
  }
}
function drawFrontFoam() {
  ctx.fillStyle = '#ffffff';
  for (let x = mod(-scroll * 1.05 + 9, 30) - 30; x < VW; x += 30) ctx.fillRect(Math.round(x), LANE + 2, 9, 1);
  ctx.fillStyle = '#bdeee9';
  for (let x = mod(-scroll * 1.05 + 20, 30) - 30; x < VW; x += 30) ctx.fillRect(Math.round(x), LANE + 3, 12, 1);
}
function drawObstacles() {
  for (const o of obstacles) {
    if (o.x > VW) continue;
    if (o.type === 'rock') ctx.drawImage(img[o.k], Math.round(o.x), o.y);
    else if (o.type === 'post') {
      ctx.drawImage(POST_ART, Math.round(o.x), o.y);
      if (Math.floor(animT * 3) % 2 === 0) rect(o.x + 6, o.y - 3, 2, 3, '#ffe066');
    } else {
      const seq = [0, 1, 2, 1], f = seq[Math.floor(animT * 10 + o.ph) % 4];
      ctx.drawImage(img.gull, f * GULL.fw, 0, GULL.fw, GULL.fh, Math.round(o.x), o.y + birdBob(o), GULL.fw, GULL.fh);
    }
  }
}
function drawWarnings() {   // gulls about to arrive: blinking "!" badge on the right edge
  for (const o of obstacles) {
    if (o.type !== 'bird' || o.x <= VW || Math.floor(animT * 8) % 2) continue;
    const x = VW - 15, y = o.y + 16;
    rect(x - 1, y - 1, 13, 15, '#2a1f3d'); rect(x, y, 11, 13, '#ffd35c'); rect(x, y, 11, 2, '#fff6b8');
    rect(x + 4, y + 2, 3, 6, '#2a1f3d'); rect(x + 4, y + 9, 3, 2, '#2a1f3d');
  }
}
function drawPlayer() {
  let f;
  if (state === 'dead') f = 4;
  else if (P.airborne) f = 2;
  else if (landT > 0) f = 3;
  else f = Math.floor(animT * 7) % 2;
  ctx.drawImage(img.player, f * FW, 0, FW, FH, PX, playerTop(), FW, FH);
}
function drawParticles() {
  for (const p of particles) {
    if (p.kind === 'heart') { if (p.age < p.life * 0.8 || Math.floor(p.age * 14) % 2) ctx.drawImage(HEART, Math.round(p.x) - 3, Math.round(p.y) - 3); continue; }
    ctx.fillStyle = p.c;
    if (p.kind === 'spark') {
      const x = Math.round(p.x), y = Math.round(p.y), a = p.age / p.life < 0.5 ? p.s : 1;
      ctx.fillRect(x, y, 1, 1);
      if (Math.floor(p.age * 20) % 3) { ctx.fillRect(x - a, y, a, 1); ctx.fillRect(x + 1, y, a, 1); ctx.fillRect(x, y - a, 1, a); ctx.fillRect(x, y + 1, 1, a); }
      continue;
    }
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  }
}
function drawButton() {
  const cx = Math.round(VW / 2), cy = 436, pressed = btnT > 0 || (active.size > 0 && state === 'play');
  disc(cx, cy + 4, 27, '#13465a');
  disc(cx, cy + (pressed ? 3 : 0), 27, '#2a1f3d');
  disc(cx, cy + (pressed ? 3 : 0), 25, pressed ? '#c22a47' : '#e8365f');
  disc(cx - 3, cy - 3 + (pressed ? 3 : 0), 18, pressed ? '#d63a57' : '#ff5c7a');
  text('JUMP', cx, cy - 7 + (pressed ? 3 : 0), 2, '#ffffff', '#7a1530');
}
function drawMute() {
  const x = VW - 22, y = 8, c = '#2a1f3d';
  rect(x, y + 4, 4, 6, c); rect(x + 4, y + 2, 2, 10, c); rect(x + 6, y, 2, 14, c);
  rect(x + 1, y + 5, 2, 4, '#ffffff');
  if (muted) { for (let i = 0; i < 7; i++) { rect(x + 10 + i, y + 3 + i, 2, 2, '#e8365f'); rect(x + 16 - i, y + 3 + i, 2, 2, '#e8365f'); } }
  else { rect(x + 10, y + 5, 2, 4, c); rect(x + 13, y + 3, 2, 8, c); }
}
function panel(x, y, w, h) {
  rect(x + 2, y + 3, w, h, 'rgba(42,31,61,0.35)');
  rect(x, y + 2, w, h - 4, '#2a1f3d'); rect(x + 2, y, w - 4, h, '#2a1f3d');
  rect(x + 2, y + 2, w - 4, h - 4, '#fff1dc');
  rect(x + 2, y + 2, w - 4, 3, '#ffffff');
}
const LOGO_TOP = ['#ffe9a8', '#ffc45c', '#ff8f3a'];
const LOGO_BOT = ['#c9f6ff', '#5fd3f0', '#2a8fd6'];
function drawHUD() {
  if (state === 'title') {
    text('JET SKI', VW / 2, 44, 5, LOGO_TOP);
    text('JUMP', VW / 2, 90, 6, LOGO_BOT);
    if (Math.floor(animT * 2.2) % 2 === 0) text('TAP TO START', VW / 2, 172, 2, '#ffffff');
    if (best > 0) text('BEST ' + best + 'M', VW / 2, 150, 1, '#ffffff');
    text('JUMP THE ROCKS', VW / 2, 194, 1, '#ffffff');
    text('HOLD FOR BIG JUMPS', VW / 2, 205, 1, '#ffffff');
    text('DONT JUMP INTO BIRDS', VW / 2, 216, 1, '#ffffff');
  } else {
    text(score + 'M', VW / 2, 14, 3, '#ffffff');
    text('BEST ' + Math.max(best, score) + 'M', VW / 2, 42, 1, '#ffffff');
    if (streak >= 3 && state === 'play') text('STREAK X' + streak, VW / 2, 54, 1, RAINBOW[Math.floor(animT * 8) % RAINBOW.length]);
  }
  for (const p of popups) {
    if (p.age < 0) continue;
    const k = p.age / p.life;
    if (k > 0.75 && Math.floor(p.age * 16) % 2) continue;
    const size = p.size || 3, x = p.x || VW / 2, y = p.y - k * (p.x ? 18 : 14);
    text(p.text, x, y, size, p.col);
    if (p.heart) { const c = textCanvas(p.text, size, p.col, '#2a1f3d'); ctx.drawImage(HEART_BIG, Math.round(x - c.width / 2 - 20), Math.round(y + 3)); ctx.drawImage(HEART_BIG, Math.round(x + c.width / 2 + 6), Math.round(y + 3)); }
  }
  if (state === 'dead' && deadT > 0.35) {
    const w = 196, h = 150, x = Math.round((VW - w) / 2), y = 70;
    panel(x, y, w, h);
    rect(x - 6, y + 12, w + 12, 24, '#2a1f3d');
    rect(x - 4, y + 14, w + 8, 20, '#e8365f');
    rect(x - 4, y + 14, w + 8, 3, '#ff7a96');
    text('GAME OVER', VW / 2, y + 17, 2, '#ffffff', '#7a1530');
    text('SCORE', VW / 2, y + 46, 1, '#8a6f8f', null);
    text(score + 'M', VW / 2, y + 58, 4, '#2a1f3d', null);
    text('BEST ' + best + 'M', VW / 2, y + 94, 1, '#2a1f3d', null);
    if (newBest && Math.floor(deadT * 4) % 2 === 0) text('NEW BEST!', VW / 2, y + 108, 2, ['#ff7aa8', '#e8365f'], null);
    if (deadT > 0.7 && Math.floor(deadT * 2.2) % 2 === 0) text('TAP TO RETRY', VW / 2, y + h + 14, 2, '#ffffff');
  }
  if (paused) {
    rect(0, 0, VW, VH, 'rgba(42,31,61,0.55)');
    text('PAUSED', VW / 2, 150, 3, '#ffffff');
    text('TAP TO RESUME', VW / 2, 186, 2, '#ffffff');
  }
  if (state !== 'play' || paused) drawMute();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() * 2 - 1) * shake * 10), Math.round((Math.random() * 2 - 1) * shake * 10));
  drawSky();
  drawSea();
  drawDolphins();
  drawObstacles();
  drawPlayer();
  drawFrontFoam();
  drawParticles();
  drawWarnings();
  ctx.restore();
  drawButton();
  drawHUD();
  if (flash > 0) rect(0, 0, VW, VH, 'rgba(255,255,255,' + (flash * 4).toFixed(2) + ')');
}

// ---------- input ----------
function toLogical(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH };
}
function press(id = 'bot') {
  initAudio();
  btnT = 0.12;
  active.add(id); lastPressId = id;
  if (paused) { paused = false; last = performance.now(); return; }
  if (state === 'title') { startGame(); return; }
  if (state === 'play') { jump(); return; }
  if (state === 'dead' && deadT > 0.7) startGame();
}
// a hold only counts while the finger that started the jump stays down
function release(id = 'bot') { active.delete(id); if (id === jumpOwner) P.holding = false; }
function releaseAll() { active.clear(); P.holding = false; }
function toggleMute() { muted = !muted; store.set('jetskijump.muted', muted ? '1' : '0'); }
window.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.button !== undefined && e.button !== 0) return;
  const p = toLogical(e);
  if (state !== 'play' && p.x > VW - 34 && p.y < 30) { initAudio(); toggleMute(); return; }
  press(e.pointerId);
}, { passive: false });
window.addEventListener('pointerup', e => { initAudio(); release(e.pointerId); });
window.addEventListener('pointercancel', e => release(e.pointerId));
window.addEventListener('touchend', initAudio);
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'Enter'];
window.addEventListener('keydown', e => {
  if (e.repeat) { if (JUMP_KEYS.includes(e.code)) e.preventDefault(); return; }
  if (JUMP_KEYS.includes(e.code)) { e.preventDefault(); press('key:' + e.code); }
  else if (e.code === 'KeyM') toggleMute();
  else if (e.code === 'KeyP' && state === 'play') paused = !paused;
});
window.addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) release('key:' + e.code); });
['touchstart', 'touchmove', 'gesturestart', 'dblclick', 'contextmenu'].forEach(ev => window.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) releaseAll();
  if (document.hidden && state === 'play') { paused = true; if (score > best) store.set('jetskijump.best', String(score)); }
});
window.addEventListener('blur', () => { releaseAll(); if (state === 'play') paused = true; });
window.addEventListener('resize', resize);

// ---------- loop ----------
let last = 0, acc = 0;
function frame(now) {
  let dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!paused) {
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
  }
  draw();
  requestAnimationFrame(frame);
}
function boot() {
  resize();
  buildSea();
  last = performance.now();
  requestAnimationFrame(frame);
}
// test hooks (used by automated checks; harmless in play)
window.__jsj = {
  get state() { return state; }, get score() { return score; }, get speed() { return speed; }, get obstacles() { return obstacles; },
  get airborne() { return P.airborne; }, get streak() { return streak; }, get meters() { return meters(); }, get dir() { return dir; },
  press, release, debug(o) { if ('dist' in o) dist = o.dist; if ('t' in o) t = o.t; if ('streak' in o) streak = o.streak; if ('bonus' in o) bonus = o.bonus; },
};
</script>
