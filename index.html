<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a1f3d">
<title>Jet Ski Jump</title>
<style>
  :root { --bg: #2a1f3d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #2a1f3d; } }
  :root[data-theme="dark"] { --bg: #2a1f3d; }
  html { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body { display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #prof { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(42,31,61,0.6); touch-action: auto; }
  #prof[hidden] { display: none; }
  #prof form { width: min(300px, calc(100vw - 32px)); box-sizing: border-box; padding: 18px; background: #fff1dc; border: 4px solid #2a1f3d; box-shadow: 4px 6px 0 rgba(42,31,61,0.35);
    font: bold 14px/1.4 ui-monospace, Menlo, monospace; color: #2a1f3d; text-transform: uppercase; display: flex; flex-direction: column; gap: 10px; }
  #prof h2 { margin: 0; font-size: 16px; color: #e8365f; }
  #prof p { margin: 0; font-size: 11px; color: #8a6f8f; text-transform: none; font-weight: normal; }
  #prof input { font: inherit; font-size: 16px; padding: 8px; border: 3px solid #2a1f3d; background: #fff; color: #2a1f3d; -webkit-user-select: text; user-select: text; }
  #prof .row { display: flex; gap: 8px; }
  #prof button { flex: 1; font: inherit; padding: 9px 6px; border: 3px solid #2a1f3d; background: #e8365f; color: #fff; cursor: pointer; }
  #prof button.alt { background: #fff; color: #2a1f3d; }
  #pmsg { min-height: 1.4em; font-size: 12px; color: #e8365f; }
</style>
</head>
<body>
<div id="safe" style="position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)"></div>
<canvas id="c" aria-label="Jet Ski Jump game. Tap or press space to jump, hold for a bigger jump."></canvas>
<div id="prof" hidden><form id="pform" autocomplete="off">
  <h2>Save across devices</h2>
  <p>Pick a name and a 4-digit PIN. Enter the same two on any phone or laptop to keep your shells and outfits.</p>
  <input id="pname" maxlength="24" placeholder="Name" aria-label="Name" autocapitalize="characters" spellcheck="false">
  <input id="ppin" maxlength="4" placeholder="4-digit PIN" aria-label="4-digit PIN" inputmode="numeric" pattern="[0-9]*" type="password">
  <div id="pmsg" role="status"></div>
  <div class="row"><button type="button" class="alt" id="pcancel">Cancel</button><button type="submit" id="pgo">Save</button></div>
  <button type="button" class="alt" id="pout" hidden>Sign out of this device</button>
</form></div>
<script id="chip-src">
// Chiptune engine v3 (mood-driven): renders a song to one seamless mono loop (Float32Array). Runs in the browser and in node.
// Song: { bpm, bar: steps per bar (16 = 4/4, 12 = 3/4 or 6/8), bars, swing (0-0.5 of a unit), swingUnit (1 = 16ths, 2 = 8ths),
//   chords (one per bar, cycled), tone (master lowpass 0-1), room (reverb size 0-1), crackle (vinyl 0-1), wow (tape wobble 0-1), parts }
// Part: { inst, vol, notes | pat, on ('1100' bar mask, cycled), oct, tr, echo, echoSteps, rev (reverb send), lp, duck (sidechain 0-1), glide }
//   notes: tokens NOTE*steps, _ rest, ~NOTE glides in from the previous note
//   pat (pitched): bar patterns, cycled: 0-9 chord tone, C whole chord, A arpeggiated chord (NES blur, arpRate/s), R root, O octave, F fifth, T third, - hold, . rest
//   pat (inst 'drums'): k kick, s snare, g ghost snare, c clap, r rim, t shaker, h hat, o open hat, x crash, w 2-bar riser,
//     m low tom, l high tom, b woodblock, z laser zap
// Song extras: rain, wind (0-1 textures). Part extras: vib (force vibrato), vibDepth, vibRate, a/d/sus/rel/dec/gate envelope overrides
// Instruments: pulse, tri, sine, bell (music box), keys (electric piano), pluck (plucked string), flute, pad, saw (supersaw), brass, accordion
const CHIP = (() => {
  const TAU = 2 * Math.PI, PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const QUAL = { '': [0, 4, 7], m: [0, 3, 7], 7: [0, 4, 7, 10], m7: [0, 3, 7, 10], M7: [0, 4, 7, 11], sus: [0, 5, 7], sus2: [0, 2, 7],
    6: [0, 4, 7, 9], m6: [0, 3, 7, 9], 9: [0, 4, 7, 10, 14], m9: [0, 3, 7, 10, 14], M9: [0, 4, 7, 11, 14], add9: [0, 4, 7, 14], dim: [0, 3, 6], aug: [0, 4, 8] };
  const acc = a => (a === '#' ? 1 : a === 'b' ? -1 : 0);
  const midi = n => { const m = /^([A-G])(#|b)?(-?\d)$/.exec(n); if (!m) throw new Error('bad note ' + n); return 12 * (+m[3] + 1) + PC[m[1]] + acc(m[2]); };
  const chord = s => { const m = /^([A-G])(#|b)?(.*)$/.exec(s); if (!m || !QUAL[m[3]]) throw new Error('bad chord ' + s); return { pc: PC[m[1]] + acc(m[2]), iv: QUAL[m[3]] }; };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const tone = (c, i, oct) => 12 * (oct + 1) + c.pc + c.iv[i % c.iv.length] + 12 * Math.floor(i / c.iv.length);

  function parseNotes(str) {
    const out = []; let t = 0;
    for (const tok of str.trim().split(/\s+/)) {
      const [n0, l = '1'] = tok.split('*'), g = n0[0] === '~', n = g ? n0.slice(1) : n0;
      if (n !== '_') out.push({ m: midi(n), s: t, l: +l, g });
      t += +l;
    }
    return out;
  }
  function parseBars(pats, bars, bar, fn) {   // one pattern per bar (cycled); '-' extends the previous note(s)
    const out = [];
    for (let b = 0; b < bars; b++) {
      const p = pats[b % pats.length]; let last = [];
      for (let i = 0; i < bar; i++) {
        const ch = p[i];
        if (ch === '-') { for (const e of last) e.l++; continue; }
        if (ch === '.') { last = []; continue; }
        last = fn(ch, b).map(e => ({ ...e, s: b * bar + i, l: 1 }));
        out.push(...last);
      }
    }
    return out;
  }

  function render(song, sr = 32000) {
    const bar = song.bar || 16, bars = song.bars || 16, steps = bar * bars, stepS = 60 / song.bpm / 4;
    const N = Math.round(steps * stepS * sr), sw = song.swing || 0, su = song.swingUnit || 2;
    const at = s => Math.round((s + (Math.floor(s / su) % 2 ? sw * su : 0)) * stepS * sr) % N;
    const chords = song.chords.trim().split(/\s+/).map(chord), ch = b => chords[b % chords.length];
    let seed = 7;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x3fffffff) - 1;

    const saws = (n, det, k) => { const p = Array.from({ length: n }, (_, j) => j / n); let z = 0;
      return f => { let s = 0; for (let j = 0; j < n; j++) { p[j] = (p[j] + f * (1 + (j - (n - 1) / 2) * det) / sr) % 1; s += 2 * p[j] - 1; } z += k * (s / n - z); return z; }; };
    const INST = {
      pulse: { a: 0.004, d: 0.12, sus: 0.6, rel: 0.05, vib: 1, make: o => { let p = 0; const du = o.duty || 0.25; return f => { p = (p + f / sr) % 1; return p < du ? 0.8 : -0.8; }; } },
      tri: { a: 0.004, d: 0.12, sus: 0.85, rel: 0.05, gate: 0.9, make: () => { let p = 0; return f => { p = (p + f / sr) % 1; return Math.round((p < 0.5 ? 4 * p - 1 : 3 - 4 * p) * 7.5) / 7.5; }; } },
      sine: { a: 0.01, d: 0.25, sus: 0.8, rel: 0.08, make: () => { let p = 0; return f => { p = (p + f / sr) % 1; return Math.sin(TAU * p) * 0.9 + 0.12 * Math.sin(2 * TAU * p); }; } },
      bell: { a: 0.002, dec: 2.4, rel: 0.4, gate: 1, make: o => { let p = 0, q = 0; const r = o.ratio || 3.5, I = o.index || 1.8;
        return (f, t) => { p = (p + f / sr) % 1; q = (q + f * r / sr) % 1; return Math.sin(TAU * p + I * Math.exp(-t * 6) * Math.sin(TAU * q)) * 0.7; }; } },
      keys: { a: 0.003, dec: 1.6, rel: 0.15, make: () => { let p = 0;
        return (f, t) => { p = (p + f / sr) % 1; return Math.sin(TAU * p + (0.35 + 1.3 * Math.exp(-t * 7)) * Math.sin(TAU * p)) * 0.6; }; } },
      pluck: { a: 0, sus: 1, rel: 0.06, gate: 1, make: (o, f) => {   // Karplus-Strong
        const P = Math.max(2, Math.round(sr / f)), d = new Float32Array(P), soft = o.soft || 0.5, damp = o.damp || 0.996; let z = 0, i = 0;
        for (let j = 0; j < P; j++) { z += soft * (rnd() - z); d[j] = z; }
        return () => { const j = (i + 1) % P, y = d[i]; d[i] = (d[i] + d[j]) * 0.5 * damp; i = j; return y * 1.8; }; } },
      flute: { a: 0.06, d: 0.1, sus: 0.85, rel: 0.09, vib: 1, make: () => { let p = 0;
        return (f, t) => { p = (p + f / sr) % 1; return (Math.sin(TAU * p) + 0.22 * Math.sin(2 * TAU * p)) * 0.7 + rnd() * (0.12 * Math.exp(-t * 25) + 0.015); }; } },
      pad: { a: 0.35, d: 0.3, sus: 0.9, rel: 0.6, make: () => { const g = saws(3, 0.006, 0.12); return f => g(f) * 1.5; } },
      saw: { a: 0.005, d: 0.15, sus: 0.75, rel: 0.08, make: o => { const g = saws(3, 0.008, o.bright || 0.45); return f => g(f); } },
      brass: { a: 0.03, d: 0.2, sus: 0.8, rel: 0.1, vib: 1, make: () => { const p = [0, 0.5]; let z = 0;   // filter opens on the attack
        return (f, t) => { let s = 0; for (let j = 0; j < 2; j++) { p[j] = (p[j] + f * (1 + (j - 0.5) * 0.005) / sr) % 1; s += p[j] - 0.5; }
          z += (0.05 + 0.35 * Math.min(1, t / 0.06) * (0.6 + 0.4 * Math.exp(-t * 5))) * (s - z); return z * 1.4; }; } },
      accordion: { a: 0.02, d: 0.1, sus: 0.9, rel: 0.06, make: () => { let p = 0, q = 0, z = 0;   // two detuned reeds
        return f => { p = (p + f / sr) % 1; q = (q + f * 1.0045 / sr) % 1; z += 0.35 * (((p < 0.5 ? 1 : -1) + (q < 0.3 ? 1 : -1)) * 0.4 - z); return z; }; } },
    };

    function voice(buf, s, l, f, vol, P, o, f0, arp) {
      const I = INST[P], a = o.a ?? I.a, d = o.d ?? I.d ?? 0, sus = o.sus ?? I.sus ?? 0, rel = o.rel ?? I.rel, dec = o.dec ?? I.dec;
      const gate = l * stepS * (o.gate || I.gate || 0.92), len = Math.round((gate + rel) * sr), st = at(s), gl = typeof o.glide === 'number' ? o.glide : 0.08;
      const gen = I.make(o, f), vib = o.vib ?? I.vib, vd = o.vibDelay ?? 0.18, vdep = o.vibDepth || 0.007, vr = o.vibRate || 5.5;
      for (let i = 0; i < len; i++) {
        const t = i / sr;
        let e = t < a ? t / a : dec ? Math.exp(-(t - a) * dec) : t < a + d ? 1 - (1 - sus) * (t - a) / d : sus;
        if (t > gate) e *= Math.max(0, 1 - (t - gate) / rel);
        const fb = arp ? arp[Math.floor(t * (o.arpRate || 40)) % arp.length] : f;
        let fi = f0 && t < gl ? fb * Math.pow(f0 / fb, 1 - t / gl) : fb;
        if (vib && t > vd) fi *= 1 + vdep * Math.sin(TAU * vr * t);
        buf[(st + i) % N] += gen(fi, t) * e * vol;
      }
    }

    function drum(buf, c, st, o) {
      const hit = (dur, fn) => { const len = Math.round(dur * sr); for (let i = 0; i < len; i++) buf[(st + i) % N] += fn(i / sr, 1 - i / len); };
      let ph = 0, hp = 0, z = 0;
      const hiss = () => { const x = rnd(), y = x - hp; hp = x; return y; };
      if (c === 'k') { const top = o.kickTop || 110; hit(o.kick || 0.15, (t, e) => { ph += (45 + top * Math.exp(-t * 30)) / sr; return Math.sin(TAU * ph) * e * e * 0.6 + (t < 0.003 ? rnd() * 0.25 : 0); }); }
      if (c === 's' || c === 'g') { const v = c === 'g' ? 0.3 : 1; hit(0.14, (t, e) => { ph += 185 / sr; return (rnd() * 0.7 + Math.sin(TAU * ph) * 0.3) * e * e * 0.3 * v; }); }
      if (c === 'c') hit(0.2, t => hiss() * (t < 0.025 ? 1 - (t % 0.008) / 0.008 : Math.exp(-(t - 0.025) * 22)) * 0.3);
      if (c === 'r') hit(0.035, (t, e) => { ph += 1700 / sr; return (Math.sin(TAU * ph) * 0.5 + rnd() * 0.3) * e * e * e * 0.45; });
      if (c === 't') hit(0.07, (t, e) => hiss() * Math.min(1, t / 0.015) * e * 0.06);
      if (c === 'h' || c === 'o') hit(c === 'h' ? 0.035 : 0.16, (t, e) => hiss() * e * 0.06);
      if (c === 'x') hit(1.4, (t, e) => hiss() * e * e * 0.12);
      if (c === 'm' || c === 'l') { const f0 = c === 'm' ? 75 : 130; hit(0.3, (t, e) => { ph += f0 * (1 + 0.6 * Math.exp(-t * 18)) / sr; return (Math.sin(TAU * ph) * 0.9 + rnd() * 0.15 * Math.exp(-t * 40)) * e * e * 0.55; }); }
      if (c === 'b') hit(0.06, (t, e) => { ph += 1050 / sr; return Math.sin(TAU * ph) * e ** 4 * 0.5; });
      if (c === 'z') hit(0.22, (t, e) => { ph += (2400 * Math.exp(-t * 14) + 150) / sr; return (ph % 1 < 0.5 ? 0.3 : -0.3) * e; });
      if (c === 'w') { const len = 2 * bar * stepS; hit(len, t => { const u = t / len; z += (0.02 + 0.5 * u * u) * (rnd() - z); return z * u * u * 0.5; }); }
    }

    const lowpass = (x, k) => { let z = 0; for (let pass = 0; pass < 2; pass++) for (let i = 0; i < N; i++) { z += k * (x[i] - z); x[i] = z; } };
    const mix = new Float32Array(N), send = new Float32Array(N), dip = new Float32Array(N), built = [];
    for (const P of song.parts) {
      const pb = new Float32Array(N), on = P.on || '1', live = s => on[Math.floor(s / bar) % on.length] === '1', vol = P.vol ?? 0.2;
      if (P.inst === 'drums') {
        for (const n of parseBars(P.pat, bars, bar, c => [{ c }])) if (live(n.s)) {
          drum(pb, n.c, at(n.s), P);
          if (n.c === 'k') { const st = at(n.s), dl = Math.round(0.22 * sr); for (let i = 0; i < dl; i++) { const j = (st + i) % N; dip[j] = Math.max(dip[j], (1 - i / dl) ** 2); } }
        }
        for (let i = 0; i < N; i++) pb[i] *= vol;
      } else {
        const evs = P.notes ? parseNotes(P.notes) : parseBars(P.pat, bars, bar, (c, b) => {
          const k = ch(b), oct = P.oct ?? 4, r = 12 * (oct + 1) + k.pc;
          if (c === 'C') return k.iv.slice(0, 4).map((_, i) => ({ m: tone(k, i, oct), v: 0.6 }));
          if (c === 'A') return [{ m: tone(k, 0, oct), arp: k.iv.map((_, i) => tone(k, i, oct)) }];
          if ('ROFT'.includes(c)) return [{ m: c === 'R' ? r : c === 'O' ? r + 12 : c === 'F' ? r + 7 : r + k.iv[1] }];
          return [{ m: tone(k, +c, oct) }];
        });
        let prev = 0;
        for (const n of evs) {
          if (!live(n.s)) { prev = 0; continue; }
          const f = hz(n.m + (P.tr || 0));
          voice(pb, n.s, n.l, f, vol * (n.v || 1), P.inst, P, (n.g || P.glide) && prev ? prev : 0, n.arp && n.arp.map(m => hz(m + (P.tr || 0))));
          prev = f;
        }
      }
      if (P.lp) lowpass(pb, P.lp);
      if (P.echo) {   // circular feedback delay, two passes so the loop seam carries the tail
        const dly = Math.round((P.echoSteps || 3) * stepS * sr), y = new Float32Array(N);
        for (let pass = 0; pass < 2; pass++) for (let i = 0; i < N; i++) y[i] = pb[i] + P.echo * y[(i - dly + N) % N];
        pb.set(y);
      }
      built.push([P, pb]);
    }
    for (const [P, pb] of built) for (let i = 0; i < N; i++) {
      const v = P.duck ? pb[i] * (1 - P.duck * dip[i]) : pb[i];
      mix[i] += v; send[i] += v * (P.rev || 0);
    }

    // Schroeder reverb on the send, circular
    const room = song.room ?? 0.5, wet = new Float32Array(N);
    for (const ms of [29.7, 37.1, 41.1, 43.7]) {
      const D = Math.round(ms / 1000 * sr * (0.8 + 0.8 * room)), fb = 0.7 + 0.24 * room, y = new Float32Array(N); let z = 0;
      for (let pass = 0; pass < 2; pass++) for (let i = 0; i < N; i++) { z += 0.4 * (y[(i - D + N) % N] - z); y[i] = send[i] + fb * z; }
      for (let i = 0; i < N; i++) wet[i] += y[i] * 0.25;
    }
    for (const ms of [5, 1.7]) {
      const D = Math.round(ms / 1000 * sr), g = 0.6, x = wet.slice(), y = new Float32Array(N);
      for (let pass = 0; pass < 2; pass++) for (let i = 0; i < N; i++) { const j = (i - D + N) % N; y[i] = -g * x[i] + x[j] + g * y[j]; }
      wet.set(y);
    }
    for (let i = 0; i < N; i++) mix[i] += wet[i] * 0.5;

    if (song.rain || song.wind) {   // weather beds, scaled to the music's level; noise is seamless enough at the loop point
      let ms = 0; for (let i = 0; i < N; i++) ms += mix[i] * mix[i];
      const lvl = Math.sqrt(ms / N) / 0.05, cyc = Math.max(1, Math.round(N / sr / 7)); let a = 0, b = 0, w = 0;
      for (let pass = 0; pass < 2; pass++) for (let i = 0; i < N; i++) {
        const x = rnd(); a += 0.3 * (x - a); b += 0.012 * (x - b); w += 0.025 * (x - w);
        if (pass) mix[i] += lvl * ((song.rain || 0) * (a - b) * 0.09 + (song.wind || 0) * w * 0.5 * (0.55 + 0.45 * Math.sin(TAU * cyc * i / N)));
      }
      if (song.rain) for (let c = Math.round(song.rain * 14 * N / sr); c > 0; c--) {
        const st = Math.floor((rnd() + 1) / 2 * N), amp = rnd() * 0.05 * lvl, f = 1800 + 1500 * rnd(); let ph = 0;
        for (let i = 0; i < 260; i++) { ph += f * (1 + i / 300) / sr; mix[(st + i) % N] += amp * Math.sin(TAU * ph) * Math.exp(-i / 50); }
      }
    }
    if (song.crackle) for (let c = Math.round(song.crackle * 25 * N / sr); c > 0; c--) {
      const st = Math.floor((rnd() + 1) / 2 * N), amp = rnd() * 0.12;
      for (let i = 0; i < 40; i++) mix[(st + i) % N] += amp * Math.exp(-i / 6) * (i % 2 ? -1 : 1);
    }
    let out = mix;
    if (song.wow) {   // tape wobble: a whole number of cycles per loop so the seam stays clean
      const cyc = Math.max(1, Math.round(N / sr * 0.5)), depth = song.wow * 0.006 * sr, y = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        const p = i - depth * (1 + Math.sin(TAU * cyc * i / N)), p0 = Math.floor(p), fr = p - p0;
        const a = out[((p0 % N) + N) % N], b = out[(((p0 + 1) % N) + N) % N]; y[i] = a + (b - a) * fr;
      }
      out = y;
    }
    lowpass(out, song.tone ?? 0.55);
    if (song.raw) return out;   // unnormalized, for level checks
    let ss = 0; for (let i = 0; i < N; i++) ss += out[i] * out[i];
    const g = (song.loud || 0.17) / Math.sqrt(ss / N);
    for (let i = 0; i < N; i++) out[i] = Math.tanh(out[i] * g) * 0.92;
    return out;
  }
  return { render };
})();
if (typeof module !== 'undefined') module.exports = CHIP;
// All 20 mood tracks for CHIP v3 (chiptune-v3.js). Each has one signature sound no other track shares. First = free default.
const SONGS = (() => {   // scoped so the helpers don't leak into the game's globals
const rep = (p, n) => Array(n).fill(p), R = n => `_*${n}`;

// ROMANTIC: 3/4 waltz, music box over plucked oom-pah-pah, no drums, big room
const WALTZ = `C6*6 A5*2 F5*4  E5*4 F5*4 A5*4  D6*6 C6*2 Bb5*4  A5*4 G5*8
               E6*6 D6*2 C6*4  F#5*4 A5*4 C6*4  Bb5*6 A5*2 G5*4  E5*4 F5*4 G5*4
               C6*6 A5*2 F5*4  Eb6*4 D6*4 C6*4  D6*6 C6*2 A5*4  Db6*4 C6*4 G5*4

function speedAt(tt) { return Math.min(400, 160 + 190 * (1 - Math.exp(-tt / 70)) + 0.9 * tt); }

function makeObstacle(spec, x) {
  if (spec.type === 'rock') { const R = ROCKS[spec.k]; return { type: 'rock', k: R.img, x, y: LANE + 5 - R.h, w: R.w, h: R.h, hb: R.hb }; }
  if (spec.type === 'post') { const Q = POSTS[spec.k]; return { type: 'post', k: spec.k, x, y: LANE + 5 - Q.h, w: POST_W, h: Q.h, hb: Q.hb }; }
  return { type: 'bird', x, y: GULL_Y, w: GULL.fw, h: GULL.fh, hb: GULL.hb, ph: 0 };
}
function obsBox(o, bob) { return { x: o.x + o.hb.x, y: o.y + (o.type === 'bird' ? bob : 0) + o.hb.y, w: o.hb.w, h: o.hb.h }; }
function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function boxGap(a, b) {   // pixels between two boxes (0 when touching / overlapping on both axes)
  const dx = Math.max(0, b.x - (a.x + a.w), a.x - (b.x + b.w));
  const dy = Math.max(0, b.y - (a.y + a.h), a.y - (b.y + b.h));
  return Math.max(dx, dy);
}
function playerBoxes(top) { return PLAYER_HB.map(b => ({ x: PX + b.x, y: top + b.y, w: b.w, h: b.h })); }
function obsSpeed(o, s) { return o.type === 'bird' ? s + BIRD_DX : s; }

// jump physics for one fixed step. p = { lift, vy, airborne, holding, holdT }
function stepJump(p, dt) {
  if (!p.airborne) return false;
  p.holdT += dt;
  const g = (p.holding && p.vy > 0 && p.holdT >= HOLD_START && p.holdT < HOLD_END) ? GRAV * HOLD_G : GRAV;
  p.vy -= g * dt;
  p.lift += p.vy * dt;
  if (p.lift <= 0) { p.lift = 0; p.vy = 0; p.airborne = false; return true; }   // landed
  return false;
}

// Each track is rendered once (in a worker, so the game never stalls) into a looping buffer; the last 3 stay cached.
const MUSIC_SR = 24000, MUSIC_VOL = 0.35, musicCache = new Map();
let musicWorker = null, musicJob = null, musicLoading = null, musicNow = null, musicSrc = null;
function songWanted() {
  const sel = state === 'shop' && ITEM[shopSel];
  if (sel && sel.slot === 'music') return sel.song;   // listen before you buy
  return musicOn ? ITEM[save.eq.music].song : null;
}
function renderSong(id, done) {
  const local = () => setTimeout(() => done(CHIP.render(SONGS.find(q => q.id === id), MUSIC_SR)), 30);
  if (musicWorker === null) try {
    const src = document.getElementById('chip-src').textContent +
      '\nonmessage = e => { const out = CHIP.render(SONGS.find(q => q.id === e.data), ' + MUSIC_SR + '); postMessage(out, [out.buffer]); };';
    musicWorker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    musicWorker.onmessage = e => { const j = musicJob; musicJob = null; if (j) j.done(e.data); };
    musicWorker.onerror = () => { musicWorker = false; const j = musicJob; musicJob = null; if (j) renderSong(j.id, j.done); };
  } catch (e) { musicWorker = false; }
  if (musicWorker) { musicJob = { id, done }; musicWorker.postMessage(id); } else local();
}
function musicStop() {
  if (musicSrc) {
    const { s, g } = musicSrc, t = actx.currentTime;
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + 0.3);
    try { s.stop(t + 0.35); } catch (e) {}

  musicStop();

  s.buffer = buf; s.loop = true;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(MUSIC_VOL, t + 0.5);
  s.connect(g); g.connect(actx.destination); s.start(t);
  musicSrc = { s, g }; musicNow = id;
}
function musicUpdate() {   // every frame: play whatever should be playing now
  if (!actx || actx.state !== 'running') return;
  const want = songWanted();
  if (want === musicNow) return;
  if (!want) { musicStop(); return; }
  if (musicCache.has(want)) { musicPlay(want, musicCache.get(want)); return; }
  if (musicLoading) return;   // one render at a time; the next frame picks up whatever is wanted then
  musicLoading = want;
  renderSong(want, out => {
    const b = actx.createBuffer(1, out.length, MUSIC_SR);
    b.getChannelData(0).set(out);
    musicCache.set(want, b);

function alphaMask(im, sx, w, h) {

function pickPattern(m) {

function update(dt) {

      particles.push({ x: wx + Math.random() * 6, y: LANE + 1, vx: -speed * 0.35 - Math.random() * 60, vy: -30 - Math.random() * 110,
        life: 0.35 + Math.random() * 0.3, age: 0, c, s: Math.random() < 0.3 ? 4 : 2 });

      if (eqNow.hair === 'hair-unicorn' && Math.random() < 0.03) { const h = PIX.hair[playerFrame()], q = h[Math.floor(Math.random() * h.length)]; sparkle(PX + q.x, playerTop() + q.y, 1, RAINBOW); }

  if (eqNow.tail === 'tail-torch' && state !== 'dead' && Math.random() < 0.15) { const f = playerFrame(); particles.push({ kind: 'ember', x: PX + TAIL_AT[f][0] + 1, y: playerTop() + TAIL_AT[f][1] - 30, vx: -speed * 0.3 - 10, vy: -25 - Math.random() * 20, life: 0.4, age: 0, s: 2 }); }

  if (!bag.some(ok)) {
    const next = pool.filter(i => !bag.includes(i));
    for (let i = next.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [next[i], next[j]] = [next[j], next[i]]; }

  const it = ITEM[shopSel];
  if (it) {
    const m = it.slot === 'music';
    if (owns(it.id)) uiBtn(L.act, save.eq[it.slot] === it.id ? (m ? 'PLAYING' : 'WEARING') : (m ? 'PLAY' : 'WEAR'), save.eq[it.slot] !== it.id, '#2fbf71', '#13465a');

}
const LOGO_TOP = ['#ffe9a8', '#ffc45c', '#ff8f3a'];
const LOGO_BOT = ['#c9f6ff', '#5fd3f0', '#2a8fd6'];

}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() * 2 - 1) * shake * 10), Math.round((Math.random() * 2 - 1) * shake * 10));
  const ev = look().env || 'env-dreamy';
  if (ev !== envId && ENV[ev]) { envId = ev; E = ENV[ev]; buildSea(); }
  drawSky();
  drawSea();
  drawDolphins();
  drawObstacles();
  drawPlayer();
  drawFrontFoam();
  drawParticles();
  drawEnvFront();
  drawWarnings();
  ctx.restore();
  if (state !== 'shop' && !boardOpen) drawButton();
  drawHUD();

// ---------- input ----------
function toLogical(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH };
}
function press(id = 'bot') {

  btnT = 0.12;
  active.add(id); lastPressId = id;
  if (paused) { paused = false; last = performance.now(); return; }

  e.preventDefault();

  const p = toLogical(e);

  if (state !== 'play' && p.x > VW - 34 && p.y < 30) { initAudio(); toggleMute(); return; }
  if (state !== 'play' && p.x > VW - 50 && p.y < 30) { initAudio(); toggleMusic(); return; }
  if ((state === 'title' || (state === 'dead' && deadT > 0.7)) && inRect(p, shopBtn())) { initAudio(); openShop(); sfx.tick(); return; }
  if (state === 'title' && inRect(p, profBtn())) { openProf(); return; }
  press(e.pointerId);
}, { passive: false });
window.addEventListener('pointerup', e => { initAudio(); release(e.pointerId); });
window.addEventListener('pointercancel', e => release(e.pointerId));
window.addEventListener('touchend', initAudio);
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'Enter'];
window.addEventListener('keydown', e => {
  if (profOpen()) { if (e.code === 'Escape') closeProf(); return; }
  if (state === 'shop') { if (e.code === 'Escape' || e.code === 'Backspace') closeShop(); return; }
  if (boardOpen) { if (['Escape', 'Backspace', ...JUMP_KEYS].includes(e.code)) { e.preventDefault(); closeBoard(); } return; }
  if (e.repeat) { if (JUMP_KEYS.includes(e.code)) e.preventDefault(); return; }
  if (JUMP_KEYS.includes(e.code)) { e.preventDefault(); press('key:' + e.code); }
  else if (e.code === 'KeyM') toggleMute();
  else if (e.code === 'KeyN') toggleMusic();
  else if (e.code === 'KeyP' && state === 'play') paused = !paused;
});
window.addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) release('key:' + e.code); });
['touchstart', 'touchmove', 'gesturestart', 'dblclick', 'contextmenu'].forEach(ev => window.addEventListener(ev, e => { if (!profOpen()) e.preventDefault(); }, { passive: false }));

// ---------- profile (cloud save) dialog ----------
const profEl = document.getElementById('prof'), pName = document.getElementById('pname'), pPin = document.getElementById('ppin');
const pMsg = document.getElementById('pmsg'), pOut = document.getElementById('pout'), pGo = document.getElementById('pgo');
function profOpen() { return !profEl.hidden; }
function openProf() {
  releaseAll();
  pName.value = profile ? profile.name : ''; pPin.value = profile ? profile.pin : ''; pMsg.textContent = '';
  pOut.hidden = !profile;
  profEl.hidden = false;
  setTimeout(() => (profile ? pPin : pName).focus(), 50);
}
function closeProf() { profEl.hidden = true; pName.blur(); pPin.blur(); }
document.getElementById('pcancel').addEventListener('click', closeProf);
profEl.addEventListener('pointerdown', e => { if (e.target === profEl) closeProf(); });

document.getElementById('pform').addEventListener('submit', async e => {
  e.preventDefault();

  pGo.disabled = true; pMsg.textContent = 'SAVING...';
